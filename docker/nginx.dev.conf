# ===========================================
# 開発環境用 Nginx設定
# ===========================================

events {
    worker_connections 1024;  # 同時接続数の上限
}

http {
    # MIMEタイプの設定（CSS・JS・画像などを正しく配信するために必要）
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # アップロードファイルの最大サイズ（アイキャッチ画像対応）
    # これを超えるとNginx段階で 413 Request Entity Too Large が返る
    client_max_body_size 20M;

    # Cookie更新による連投も、Djangoへ渡す前に必ず抑える。
    limit_req_zone $binary_remote_addr zone=coco_ip:1m rate=10r/m;
    limit_req_zone $server_name zone=coco_site:1m rate=30r/m;

    server {
        listen 80;              # HTTPポート80番で待ち受ける
        server_name localhost;  # 開発環境なのでlocalhost

        # 静的ファイル（CSS・JS・画像）の配信
        location /static/ {
            alias /app/staticfiles/;
        }

        # アップロードされた画像の配信
        location /media/ {
            alias /app/media/;
        }

        # 会話APIは他のページから独立させ、DBや外部APIへ届く前にも制限する。
        location = /api/coco/chat/ {
            client_max_body_size 32k;
            limit_req zone=coco_ip burst=5 nodelay;
            limit_req zone=coco_site burst=10 nodelay;
            limit_req_status 429;
            error_page 429 = @coco_rate_limited;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 95s;
        }

        location @coco_rate_limited {
            default_type application/json;
            charset utf-8;
            return 429 '{"error":{"code":"rate_limit","message":"少し間をあけて話しかけてね。"}}';
        }

        # それ以外のリクエストはDjangoに転送
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}