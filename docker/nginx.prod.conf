# ===========================================
# 本番環境用 Nginx設定（HTTPS対応）
# ===========================================

events {
    worker_connections 1024;  # 同時接続数の上限
}

http {
    # セキュリティのためNginxのバージョン情報を非表示にする
    server_tokens off;  
    # MIMEタイプの設定
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # アップロードファイルの最大サイズ（記事画像対応）
    client_max_body_size 20M;

    # Cookie更新による連投も、Djangoへ渡す前に必ず抑える。
    limit_req_zone $binary_remote_addr zone=coco_ip:1m rate=10r/m;
    limit_req_zone $server_name zone=coco_site:1m rate=30r/m;

    # gzip圧縮（HTML/CSS/JSを軽くして転送速度UP）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # -------------------------------------------
    # HTTP (80) → HTTPS (443) へリダイレクト
    # certbotの認証チャレンジだけHTTPのまま受け付ける
    # -------------------------------------------
    server {
        listen 80;
        server_name example.com www.example.com;

        # Let's Encryptの証明書取得・更新時のチャレンジ応答
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # それ以外は全てHTTPSにリダイレクト（恒久的:301）
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------
    # HTTPS (443) 本体
    # -------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name example.com www.example.com;

        # SSL証明書（Let's Encryptが発行したもの）
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        # SSL/TLS設定（安全なプロトコル・暗号スイートのみ許可）
        ssl_protocols TLSv1.2 TLSv1.3;
        # TLS 1.2は前方秘匿性のあるAEADだけを許可し、CBC等の古い方式を除く。
        # TLS 1.3の暗号はこの指定の対象外で、OpenSSLの安全な既定値を使う。
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # -----------------------------------------
        # セキュリティヘッダー
        # -----------------------------------------
        # キャッシュ用add_headerがあるstatic/mediaにも、同じセキュリティヘッダーを継承。
        # add_header_inheritはNginx 1.29.3以降で利用できる（本番は1.31系）。
        add_header_inherit merge;
        # Django側のHSTSは転送せず、HTTPSを終端するNginxから1本だけ送る。
        proxy_hide_header Strict-Transport-Security;
        # HSTS: 1年間HTTPS強制（includeSubDomains/preloadは付けず復旧可能に）
        add_header Strict-Transport-Security "max-age=31536000" always;

        # MIMEタイプの推測を禁止（XSS対策）
        add_header X-Content-Type-Options nosniff always;

        # iframe埋め込み禁止（クリックジャッキング対策）
        add_header X-Frame-Options DENY always;

        # リファラ情報の送出を制限
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        
        # クロスサイトスクリプティング対策
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

        # Content Security Policy（Report-Only モード）
        # - 1週間モニタリング後、違反ゼロを確認してから本番モード(-Report-Only外す)に切替
        # - myblog の実態（Bootstrap, Toast UI Editor, Cropper.js, GA4, Sentry）に合わせた許可リスト
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://uicdn.toast.com https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://uicdn.toast.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://www.google-analytics.com https://*.analytics.google.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src 'self'; child-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        # -----------------------------------------
        # コンテンツ配信
        # -----------------------------------------
        # 静的ファイル（CSS/JS/画像）
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;  # ブラウザキャッシュ30日
            add_header Cache-Control "public, immutable";
        }

        # アップロードされた画像
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # 会話APIは他のページから独立させ、DBや外部APIへ届く前にも制限する。
        location = /api/coco/chat/ {
            client_max_body_size 32k;
            limit_req zone=coco_ip burst=5 nodelay;
            limit_req zone=coco_site burst=10 nodelay;
            limit_req_status 429;
            error_page 429 = @coco_rate_limited;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 95s;
        }

        location @coco_rate_limited {
            default_type application/json;
            charset utf-8;
            return 429 '{"error":{"code":"rate_limit","message":"少し間をあけて話しかけてね。"}}';
        }

        # それ以外のリクエストはDjangoに転送
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Djangoが「HTTPSで来た」と判定するのに必要
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
